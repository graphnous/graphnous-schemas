openapi: 3.1.0

info:
  title: Graphnous API
  description: Public API for the Graphnous platform.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://api.graphnous.dev
    description: Graphnous API

security: []

paths:
  /api/v1/systems:
    get:
      operationId: listSystems
      summary: List systems
      tags:
        - Systems
      parameters:
        - name: page
          in: query
          required: false
          description: The zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: The number of systems per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: The field to sort systems by.
          schema:
            type: string
            enum:
              - name
              - createdAt
            default: name
        - name: direction
          in: query
          required: false
          description: The sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: A list of systems.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPage"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createSystem
      summary: Create a system
      tags:
        - Systems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSystemRequest"
      responses:
        "201":
          description: The created system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/systems/{systemId}:
    parameters:
      - name: systemId
        in: path
        required: true
        description: The ID of the system.
        schema:
          type: string
          format: uuid

    get:
      operationId: getSystem
      summary: Get a system
      tags:
        - Systems
      responses:
        "200":
          description: The requested system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: System not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: updateSystem
      summary: Update a system
      tags:
        - Systems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemRequest"
      responses:
        "200":
          description: The updated system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: System not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteSystem
      summary: Delete a system
      tags:
        - Systems
      responses:
        "204":
          description: System deleted.
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: System not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A project of the system still has active scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/systems/{systemId}/projects:
    parameters:
      - name: systemId
        in: path
        required: true
        description: The ID of the system.
        schema:
          type: string
          format: uuid

    get:
      operationId: listProjects
      summary: List projects
      tags:
        - Projects
      parameters:
        - name: page
          in: query
          required: false
          description: The zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: The number of projects per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: The field to sort projects by.
          schema:
            type: string
            enum:
              - name
              - createdAt
            default: name
        - name: direction
          in: query
          required: false
          description: The sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: A list of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: System not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createProject
      summary: Create a project in a system
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: System not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: The ID of the project.
        schema:
          type: string
          format: uuid

    get:
      operationId: getProject
      summary: Get a project
      tags:
        - Projects
      responses:
        "200":
          description: The requested project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    put:
      operationId: updateProject
      summary: Update a project
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteProject
      summary: Delete a project
      tags:
        - Projects
      responses:
        "204":
          description: Project deleted.
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The project still has active scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/projects/{projectId}/scans:
    parameters:
      - name: projectId
        in: path
        required: true
        description: The ID of the project.
        schema:
          type: string
          format: uuid

    get:
      operationId: listScans
      summary: List scans
      tags:
        - Scans
      parameters:
        - name: page
          in: query
          required: false
          description: The zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: The number of scans per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: The field to sort scans by.
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
        - name: direction
          in: query
          required: false
          description: The sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: A list of scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanPage"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createScan
      summary: Create a scan
      tags:
        - Scans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanRequest"
      responses:
        "201":
          description: The created scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/projects/{projectId}/scan-results:
    parameters:
      - name: projectId
        in: path
        required: true
        description: The ID of the project.
        schema:
          type: string
          format: uuid

    post:
      operationId: uploadScanResults
      summary: Upload scan results
      description: >
        Creates a scan from result files scanned elsewhere, such as by a CI
        job or a build plugin: one file per scanned target, each following
        the scan result schema. The scan's CHECKOUT, PLAN and SCAN steps are
        skipped; storing and enhancing the results continue in the
        background. The Location header is where to follow the scan's steps.
      tags:
        - Scans
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - branch
                - revision
                - files
              properties:
                branch:
                  type: string
                  minLength: 1
                revision:
                  type: string
                  minLength: 1
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The created scan.
          headers:
            Location:
              description: The scan's steps.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: A file is not a valid scan result, has no target, or two files are for the same target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not allowed, or the plan does not allow more (code PLAN_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: A file or the request is larger than the server accepts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid

    get:
      operationId: getScan
      summary: Get a scan
      tags:
        - Scans
      responses:
        "200":
          description: The requested scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteScan
      summary: Delete a scan
      description: >
        Deletes a finished scan with its results and logs. A scan that is
        still pending, queued or running cannot be deleted.
      tags:
        - Scans
      responses:
        "204":
          description: Scan deleted.
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The scan is still active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/scans/{scanId}/steps:
    parameters:
      - name: scanId
        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid

    get:
      operationId: getScanExecution
      summary: Get the steps of a scan
      description: >
        Returns every step of executing the scan, in the order they run,
        with their status and, for a failed step, why it failed.
      tags:
        - Scans
      responses:
        "200":
          description: The scan's steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanExecution"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/scans/{scanId}/logs:
    parameters:
      - name: scanId
        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid

    get:
      operationId: listScanLogs
      summary: List scan logs
      description: Returns the logs for a scan ordered by sequence.
      tags:
        - Scan Logs
      parameters:
        - name: page
          in: query
          required: false
          description: The zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: The number of log entries per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: A page of scan logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanLogPage"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/scans/{scanId}/logs/stream:
    parameters:
      - name: scanId
        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid

    get:
      operationId: streamScanLogs
      summary: Stream scan logs
      description: Streams new log entries for a scan using Server-Sent Events.
      tags:
        - Scan Logs
      responses:
        "200":
          description: A stream of scan log events.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ScanLog"
        "403":
          description: Not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Get capabilities
      description: >
        Returns the capabilities available in this deployment. Capabilities
        are determined by the deployment type.
      tags:
        - Capabilities
      responses:
        "200":
          description: Capabilities for the deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /api/v1/projects/{projectId}/scan-settings:
    parameters:
      - name: projectId
        in: path
        required: true
        description: The ID of the project.
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectScanSettings
      summary: Get a project's scan settings
      description: What the project's scans leave out, and which languages they scan.
      tags:
        - Projects
      responses:
        "200":
          description: The project's scan settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProjectScanSettings
      summary: Update a project's scan settings
      description:
        Sets what the project's scans leave out and which languages they scan from now on; a
        setting left out stays as it is, and the scans it has stay as they are.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanSettings"
      responses:
        "200":
          description: The project's scan settings, as kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/stats:
    parameters:
      - name: projectId
        in: path
        required: true
        description: The ID of the project.
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectStats
      summary: Get a project's stats
      description:
        The stats of the project's latest scan that has any, with how many scans the project
        has; all zero but that when none has, such as before its first scan completed.
      tags:
        - Projects
      responses:
        "200":
          description: The project's stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/systems/{systemId}/stats:
    parameters:
      - name: systemId
        in: path
        required: true
        description: The ID of the system.
        schema:
          type: string
          format: uuid
    get:
      operationId: getSystemStats
      summary: Get a system's stats
      description:
        The stats of the latest scan that has any of each project of the system, added up, with
        how many projects it has and how many scans they have.
      tags:
        - Systems
      responses:
        "200":
          description: The system's stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/systems/{systemId}/scans:
    parameters:
      - name: systemId
        in: path
        required: true
        description: The ID of the system.
        schema:
          type: string
          format: uuid
    get:
      operationId: listSystemScans
      summary: List the scans of a system
      description: The scans of every project of the system.
      tags:
        - Systems
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: size
          in: query
          required: false
          description: The number of items per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: The field to sort by.
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
        - name: direction
          in: query
          required: false
          description: The sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: A page of scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/systems/{systemId}/dependencies:
    parameters:
      - name: systemId
        in: path
        required: true
        description: The ID of the system.
        schema:
          type: string
          format: uuid
    get:
      operationId: listSystemDependencies
      summary: List the dependencies of a system
      description:
        The libraries the latest completed scan of each project of the system depends on, each
        with the module and project that depends on it.
      tags:
        - Systems
      parameters:
        - name: query
          in: query
          required: false
          description: Only those whose name contains this, ignoring case.
          schema:
            type: string
        - name: module
          in: query
          required: false
          description: Only those of the module with this path.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Only those of this scope, such as compile or test.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - name: size
          in: query
          required: false
          description: The number of items per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          required: false
          description: The field to sort by.
          schema:
            type: string
            enum:
              - name
              - module
              - scope
            default: name
        - name: direction
          in: query
          required: false
          description: The sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: A page of dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDependencyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

