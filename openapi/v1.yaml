        depth:
          type: integer
          minimum: 0
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ScanGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ScanGraphEdge"
        truncated:
          type: boolean
          description: Whether there are more nodes within reach than it holds.
        layers:
          type: array
          items:
            $ref: "#/components/schemas/ScanGraphLayer"
          description: The layers of the scan, to show or leave out.

    ScanGraphNode:
      type: object
      required:
        - id
        - type
        - name
        - depth
        - properties
      properties:
        id:
          type: string
        type:
          type: string
          description: Such as Class, Method or a label an enhancer added.
        name:
          type:
            - string
            - "null"
        depth:
          type: integer
          minimum: 0
          description: How many relationships away from where the graph starts.
