        module:
          type:
            - string
            - "null"
        path:
          type:
            - string
            - "null"
        language:
          type:
            - string
            - "null"
        sourceSet:
          type:
            - string
            - "null"
        size:
          type:
            - integer
            - "null"
          minimum: 0
        checksum:
          type:
            - string
            - "null"
        classes:
          type: integer
          minimum: 0
        functions:
          type: integer
          minimum: 0

    ScanClass:
      type: object
      description: A class of a scan.
      required:
        - id
        - name
        - qualifiedName
        - kind
        - modifiers
        - module
        - file
        - packageName
        - superClass
        - interfaces
        - annotations
        - methods
        - fields
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
        qualifiedName:
          type:
            - string
            - "null"
        kind:
          type:
            - string
            - "null"
        modifiers:
          type:
            - array
            - "null"
          items:
            type: string
        module:
          type:
            - string
            - "null"
        file:
          type:
            - string
            - "null"
        packageName:
          type:
            - string
            - "null"
        superClass:
          type:
            - string
            - "null"
        interfaces:
          type:
            - array
            - "null"
          items:
            type: string
        annotations:
          type:
            - array
            - "null"
          items:
            type: string
        methods:
          type: integer
          minimum: 0
        fields:
          type: integer
          minimum: 0

    ScanMethod:
      type: object
      description: A method or function of a scan.
      required:
        - id
        - name
        - qualifiedName
        - kind
        - modifiers
        - returnType
        - parameterNames
        - parameterTypes
        - annotations
        - className
        - module
        - file
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
        qualifiedName:
          type:
            - string
            - "null"
        kind:
          type:
            - string
            - "null"
        modifiers:
          type:
            - array
            - "null"
          items:
            type: string
        returnType:
          type:
            - string
            - "null"
        parameterNames:
          type:
            - array
            - "null"
          items:
            type: string
        parameterTypes:
          type:
            - array
            - "null"
          items:
            type: string
        annotations:
          type:
            - array
            - "null"
          items:
            type: string
        className:
          type:
            - string
            - "null"
        module:
          type:
            - string
            - "null"
        file:
          type:
            - string
            - "null"

    ScanDependency:
      type: object
      description: A library a module of a scan depends on.
      required:
        - id
        - module
        - name
        - version
        - scope
      properties:
        id:
          type: string
        module:
          type:
            - string
            - "null"
        name:
          type: string
          description: Such as org.slf4j:slf4j-api.
        version:
          type:
            - string
            - "null"
        scope:
          type:
            - string
            - "null"

    ScanGraph:
      type: object
      description: Nodes and relationships of a scan's graph.
      required:
        - scanId
        - focus
        - depth
        - nodes
        - edges
        - truncated
        - layers
      properties:
        scanId:
          type: string
          format: uuid
