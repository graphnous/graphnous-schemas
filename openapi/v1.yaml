      - name: scanId
        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid
    post:
      operationId: enhanceScan
      summary: Enhance a scan again
      description:
        "Enhances a completed scan again, such as with an enhancer installed or updated since:
        what the enhancers added before is replaced. With restore, the results the scan kept are stored
        again first. Enhancing continues in the background; the location is where to follow its steps."
      tags:
        - Scans
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnhanceScanRequest"
      responses:
        "202":
          description: The scan, being enhanced again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
