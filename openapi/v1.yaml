components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflicts with the current state, such as a scan that is not completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: The zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            A machine-readable error code, such as VALIDATION_ERROR or
            MALFORMED_REQUEST (400), FORBIDDEN (403, no permission), PLAN_LIMIT
            (403, the plan does not include it or its limit is reached),
            NOT_FOUND (404), CONFLICT (409) or INTERNAL_ERROR (500).
        message:
          type: string
          description: A human-readable description of the error.

    Page:
      type: object
      additionalProperties: true
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 1000
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    SystemPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: true
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/System"

    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: true
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Project"

    ScanPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: true
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Scan"

    ScanExecution:
      type: object
      required:
        - scanId
        - steps
      properties:
        scanId:
          type: string
          format: uuid
        steps:
          type: array
          description: Every step of the scan, in the order they run.
          items:
            $ref: "#/components/schemas/ScanStep"

    ScanStep:
      type: object
      required:
        - type
        - status
      properties:
        type:
          type: string
          description: >
            CHECKOUT (the repository), PLAN (finding the targets to scan),
            SCAN (scanning them), STORE (storing the results in the graph),
            ENHANCE_RESULTS (target-scoped enhancers) and ENHANCE_SCAN
            (scan-scoped enhancers), in this order.
          enum:
            - CHECKOUT
            - PLAN
            - SCAN
            - STORE
            - ENHANCE_RESULTS
            - ENHANCE_SCAN
        status:
          type: string
          description: >
            SKIPPED when an earlier step failed. A failed enhance step does
            not fail the scan, as its results are stored.
          enum:
            - PENDING
            - RUNNING
            - COMPLETED
            - FAILED
            - SKIPPED
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        error:
          type: [string, "null"]
          description: Why the step failed; null otherwise.

    ScanLogPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          additionalProperties: true
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/ScanLog"

    CreateSystemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    CreateProjectRequest:
      type: object
      required:
        - name
        - gitUrl
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        gitUrl:
          type: string
          minLength: 1
        path:
          type: string

    UpdateSystemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    UpdateProjectRequest:
      type: object
      required:
        - name
        - systemId
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        path:
          type: string
        systemId:
          type: string
          format: uuid

    CreateScanRequest:
      type: object
      required:
        - branch
      properties:
        branch:
          type: string
          minLength: 1
        revision:
          description: The commit, tag or other git revision to scan; the tip of the branch when missing. The scan keeps it as its requestedRevision, and its revision is the commit it checks out.
          type: string
          minLength: 1
        enhancers:
          description:
            The names of the enhancers to run on the scan's results, as GET /enhancers lists them;
            every installed one when missing, none when empty.
          type: array
          items:
            type: string
        excludes:
          description:
            The patterns of the files to leave out of the scan, such as *.spec.ts, written as in a
            .gitignore; the project's own when missing, none when empty.
          type: array
          items:
            type: string
        languages:
          description:
            The languages to scan, as GET /scanners lists them, such as JAVA; the project's own when
            missing, every language the scan finds when empty.
          type: array
          items:
            type: string

    System:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      required:
        - id
        - name
        - gitUrl
        - systemId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        gitUrl:
          type: string
          minLength: 1
        path:
          type: [string, "null"]
        systemId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Scan:
      type: object
      required:
        - id
        - projectId
        - branch
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        branch:
          type: string
          minLength: 1
        revision:
          description: The commit the scan is of, as its full hash once the scan has checked it out; null until then. For an uploaded scan, the revision it was uploaded with.
          type: [string, "null"]
          minLength: 1
        requestedRevision:
          description: The revision the scan was asked for, such as a tag or a short commit hash, as it was given; null when it was asked for the tip of its branch.
          type: [string, "null"]
          minLength: 1
        status:
          type: string
          enum:
            - PENDING
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          description: When the scan started running; null until then.
          type: [string, "null"]
          format: date-time
        completedAt:
          description: When the scan completed or failed; null while it is active.
          type: [string, "null"]
          format: date-time

    ScanLog:
      type: object
      required:
        - id
        - scanId
        - sequence
        - timestamp
        - level
        - message
      properties:
        id:
          type: string
          format: uuid
        scanId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum:
            - TRACE
            - DEBUG
            - INFO
            - WARN
            - ERROR
        message:
          type: string

    CapabilitiesResponse:
      type: object
      required:
        - capabilities
        - authorization
      properties:
        capabilities:
          type: array
          description: The capabilities available in this deployment.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Capability"
        authorization:
          type: object
          description: The authorization settings of this deployment.
          required:
            - enabled
          properties:
            enabled:
              type: boolean
              description: Whether authorization is enabled in this deployment.

    Capability:
      type: string
      enum:
        - SCANNING
        - PRIVATE_REPOSITORIES
        - ARCHITECTURE_ANALYSIS
        - ARCHITECTURE_RULES
        - ARCHITECTURE_VIOLATIONS
        - SCAN_COMPARISON
        - CROSS_PROJECT_ANALYSIS
        - CUSTOM_ENHANCERS
        - CUSTOM_RULESETS
        - AI
        - BYOK_AI

    ScanSettings:
      type: object
      description:
        What a project's scans leave out, and which languages they scan; a scan can be created
        with others.
      required: []
      properties:
        excludes:
          type: array
          items:
            type: string
          description:
            The patterns of the files the project leaves out of its scans, such as *.spec.ts, written
            as in a .gitignore; unchanged when missing.
        languages:
          type: array
          items:
            type: string
          description:
            The languages the project scans, as GET /scanners lists them, such as JAVA; every language
            its scans find when empty, unchanged when missing.

    ProjectStats:
      type: object
      description: How much the latest scan of a project with stats covered, counted from its results.
      required:
        - scanId
        - numberOfModulesScanned
        - languages
        - numberOfClassesParsed
        - numberOfMethodsParsed
        - numberOfScans
      properties:
        scanId:
          type:
            - string
            - "null"
          format: uuid
          description: The scan the stats were counted from; null when no scan of the project has stats yet.
        numberOfModulesScanned:
          type: integer
          minimum: 0
          description: The modules of every target.
        languages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description:
            The files by the language of their target, such as JAVA; each a path from the root
            of its project's repository.
        numberOfClassesParsed:
          type: integer
          minimum: 0
          description: The classes, each counted once per module.
        numberOfMethodsParsed:
          type: integer
          minimum: 0
          description: The methods of those classes, and the functions outside any class.
        numberOfScans:
          type: integer
          minimum: 0
          description: The project's scans, whatever their status.

    SystemStats:
      type: object
      description: How much the latest scans of a system's projects covered together.
      required:
        - systemId
        - numberOfProjectsScanned
        - numberOfModulesScanned
        - languages
        - numberOfClassesParsed
        - numberOfMethodsParsed
        - numberOfProjects
        - numberOfScans
      properties:
        systemId:
          type: string
          format: uuid
        numberOfProjectsScanned:
          type: integer
          minimum: 0
          description: The projects with a scan that has stats.
        numberOfModulesScanned:
          type: integer
          minimum: 0
          description: The modules of those projects.
        languages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description:
            The files by the language of their target, such as JAVA; each a path from the root
            of its project's repository.
        numberOfClassesParsed:
          type: integer
          minimum: 0
          description: The classes of those projects.
        numberOfMethodsParsed:
          type: integer
          minimum: 0
          description: The methods of those projects.
        numberOfProjects:
          type: integer
          minimum: 0
          description: The projects of the system, scanned or not.
        numberOfScans:
          type: integer
          minimum: 0
          description: The scans of those projects, whatever their status.

    ScanOptions:
      type: object
      description: What a scan was created with besides its source.
      required:
        - enhancers
        - excludes
        - languages
      properties:
        enhancers:
          type:
            - array
            - "null"
          items:
            type: string
          description:
            The enhancers chosen for the scan; null when none were chosen, which ran every installed
            enhancer.
        excludes:
          type: array
          items:
            type: string
          description: The patterns of the files the scan left out; empty when it kept every file.
        languages:
          type: array
          items:
            type: string
          description: The languages the scan scanned; empty when it scanned every language found.

    EnhanceScanRequest:
      type: object
      required: []
      properties:
        enhancers:
          type:
            - array
