        - head
        - summary
        - added
        - removed
        - changed
        - truncated
      properties:
        base:
          type: string
          format: uuid
        head:
          type: string
          format: uuid
        summary:
          type: array
          items:
            $ref: "#/components/schemas/ScanComparisonSummary"
        added:
          type: array
          items:
            $ref: "#/components/schemas/ComparedNode"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/ComparedNode"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/ChangedNode"
        truncated:
          type: boolean

    ScanComparisonSummary:
      type: object
      required:
        - type
        - added
        - removed
        - changed
      properties:
        type:
          type: string
        added:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0

    ComparedNode:
      type: object
      required:
        - key
        - type
        - name
        - properties
      properties:
        key:
          type: string
        type:
          type: string
        name:
          type:
            - string
            - "null"
        properties:
          type: object
          additionalProperties: true

    ChangedNode:
      type: object
      required:
        - key
        - type
        - name
        - properties
      properties:
        key:
          type: string
        type:
          type: string
        name:
          type:
            - string
            - "null"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/ChangedProperty"

    ChangedProperty:
      type: object
      required:
        - name
        - before
        - after
      properties:
        name:
          type: string
        before:
          description: Any value, or null.
        after:
          description: Any value, or null.

    ScanUsages:
      type: object
      description: "What uses a node of a scan: what a change to it affects."
      required:
        - scanId
        - subject
        - usages
        - truncated
      properties:
        scanId:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/ScanUsageNode"
        usages:
          type: array
          items:
            $ref: "#/components/schemas/ScanUsage"
          description: By file and line.
        truncated:
          type: boolean
          description: Whether there are more usages than it holds.

    ScanUsageNode:
      type: object
      required:
        - id
        - type
        - name
        - qualifiedName
      properties:
        id:
          type: string
          description: Its id in the scan's graph, the focus of GET /scans/{scanId}/graph.
        type:
          type: string
          description: Class, Method or Field.
        name:
          type:
            - string
            - "null"
        qualifiedName:
          type:
            - string
            - "null"

    ScanUsage:
      type: object
      description: One place that uses what was asked about, or one of its members.
      required:
        - relationship
        - user
        - owner
        - file
        - line
        - target
        - targetOwner
        - depth
        - arguments
        - scanId
        - projectId
        - request
      properties:
        relationship:
          type: string
          enum:
            - CALLS
            - INSTANTIATES
            - READS
            - WRITES
            - USES
            - EXTENDS
            - IMPLEMENTS
            - OVERRIDES
            - REQUESTS
          description: How it uses it.
        user:
          $ref: "#/components/schemas/ScanUsageNode"
        owner:
          type:
            - string
            - "null"
          description: The name of the class the user is a method of.
        file:
          type:
            - string
            - "null"
          description: The path of the file the user is in.
        line:
          type:
            - integer
            - "null"
          minimum: 0
          description: The line it uses it on, when the scan says.
        target:
          $ref: "#/components/schemas/ScanUsageNode"
        targetOwner:
          type:
            - string
            - "null"
          description: The name of the class the target is a method or field of.
        depth:
          type: integer
          minimum: 1
          description: 1 for what uses it itself, 2 for what calls that, and so on.
        arguments:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ScanUsageArgument"
          description:
            What a call or an instantiation passes, in the order written; null for another relationship,
            and when the scan did not record them.
        scanId:
          type: string
          format: uuid
          description: "The scan the user is in: the one asked about, or over HTTP that of another project."
        projectId:
          type:
            - string
            - "null"
          format: uuid
          description: The project of that scan.
        request:
          oneOf:
            - $ref: "#/components/schemas/ScanUsageRequest"
            - type: "null"
          description: For REQUESTS, the call and the endpoint it requests.

    ScanUsageArgument:
      type: object
      required:
        - name
        - value
        - spread
      properties:
        name:
          type:
            - string
            - "null"
          description: The name it is passed under; null when passed by position.
        value:
          type: string
          description: The expression passed, as written.
        spread:
          type: boolean
          description: Whether it is spread, so what it passes is not known.

    ScanUsageRequest:
      type: object
      description: An HTTP call of an endpoint the target serves.
      required:
        - callMethod
        - callUrl
        - endpointMethod
        - endpointUrl
      properties:
        callMethod:
          type:
            - string
            - "null"
          description: What the call requests with, such as GET; null when the scan does not say.
        callUrl:
          type:
            - string
            - "null"
          description: The url the call requests, as written.
        endpointMethod:
          type:
            - string
            - "null"
          description: The endpoint's method, or ANY.
        endpointUrl:
          type:
            - string
            - "null"
          description: The endpoint's path.

    SystemDependency:
      type: object
      description: A library a module of a project of the system depends on.
      required:
        - id
        - projectId
        - scanId
        - module
        - name
        - version
        - scope
      properties:
        id:
          type: string
          description: Its id in its scan's graph.
        projectId:
          type: string
          format: uuid
        scanId:
          type: string
          format: uuid
        module:
          type:
            - string
            - "null"
        name:
          type: string
        version:
          type:
            - string
            - "null"
        scope:
          type:
            - string
            - "null"

    SystemLibrary:
      type: object
      description: A library the system's projects depend on, with the versions they use.
      required:
        - name
        - versions
      properties:
        name:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/SystemLibraryVersion"

    SystemLibraryVersion:
      type: object
      required:
        - version
        - projects
      properties:
        version:
          type:
            - string
            - "null"
        projects:
          type: array
          items:
            type: string
            format: uuid

    SystemLinks:
      type: object
      description: How the projects of a system are linked over HTTP.
      required:
        - links
        - calls
        - endpoints
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/SystemLink"
        calls:
          type: integer
          minimum: 0
          description: How many HTTP calls the scans have.
        endpoints:
          type: integer
          minimum: 0
          description: How many endpoints the scans have.

    SystemLink:
      type: object
      required:
        - call
        - endpoint
        - match
        - crossesProjects
      properties:
        call:
          $ref: "#/components/schemas/SystemLinkCall"
        endpoint:
          $ref: "#/components/schemas/SystemLinkEndpoint"
        match:
          type: string
          enum:
            - PATH
            - SUFFIX
          description:
            PATH when the call's whole path is the endpoint's; SUFFIX when it is its end, after
            a base only known when it runs.
        crossesProjects:
          type: boolean

    SystemLinkCall:
      type: object
      required:
        - id
        - scanId
        - projectId
        - httpMethod
        - url
        - client
      properties:
        id:
          type: string
        scanId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        httpMethod:
          type:
            - string
            - "null"
        url:
          type:
            - string
            - "null"
        client:
          type:
            - string
            - "null"
          description: What makes the call, such as fetch.

    SystemLinkEndpoint:
      type: object
      required:
        - id
        - scanId
        - projectId
        - httpMethod
        - url
      properties:
        id:
          type: string
        scanId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        httpMethod:
          type:
            - string
            - "null"
        url:
          type:
            - string
            - "null"

    ChatThreadSummary:
      type: object
      description: A chat thread, without its messages.
      required:
        - id
        - systemId
        - projectId
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        systemId:
          type: string
          format: uuid
        projectId:
          type:
            - string
            - "null"
          format: uuid
          description: The project it is about; null for the system.
        title:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatThread:
      type: object
      description: A chat thread with its messages.
      required:
        - id
        - systemId
        - projectId
        - title
        - messages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        systemId:
          type: string
          format: uuid
        projectId:
          type:
            - string
            - "null"
          format: uuid
          description: The project it is about; null for the system.
        title:
          type:
            - string
            - "null"
        messages:
          description: The thread's messages, as the assistant keeps them.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScanModulePage:
      allOf:
