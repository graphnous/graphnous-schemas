        what enhancers added to the scans. The links of the latest completed scans are the ones stored in
        the graph; those of other scans are found anew each time.
      tags:
        - Systems
      parameters:
        - name: scans
          in: query
          required: false
          description:
            The scans to link, such as the ones a graph shows; the latest completed scan of each
            project when missing. At most 50.
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 50
