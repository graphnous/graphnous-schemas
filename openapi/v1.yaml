        in: path
        required: true
        description: The ID of the scan.
        schema:
          type: string
          format: uuid
    get:
      operationId: getScanUsages
      summary: Get what uses a node of a scan
      description:
        "What a change to a class, method or field affects: where a method is called, a class
        instantiated, named as a type, extended or implemented, a field read or written; following inheritance,
        and over HTTP what requests an endpoint it serves, from another project of the system too."
      tags:
        - Scans
      parameters:
        - name: node
          in: query
          required: true
          description: The id of a class, method or field of the scan, or of what an enhancer added to one.
          schema:
            type: string
            minLength: 1
        - name: depth
          in: query
          required: false
          description: 1 for what uses the node itself; up to 3 to also follow what calls that.
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
      responses:
        "200":
          description: What uses the node.
          content:
